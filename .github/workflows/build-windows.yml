name: Build Windows Custom RustDesk

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: false
        default: 'nightly'
      upload_artifact:
        description: 'Upload build artifact'
        type: boolean
        default: true
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build-windows.yml'

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  TAG_NAME: "${{ github.event.inputs.tag_name || 'nightly' }}"
  UPLOAD_ARTIFACT: "${{ github.event.inputs.upload_artifact || 'true' }}"
  # Secrets
  CUSTOM_APP_NAME: "${{ secrets.CUSTOM_APP_NAME }}"
  CUSTOM_CONFIG_DIR: "${{ secrets.CUSTOM_CONFIG_DIR }}"
  RENDEZVOUS_SERVER: "${{ secrets.RENDEZVOUS_SERVER }}"
  RS_PUB_KEY: "${{ secrets.RS_PUB_KEY }}"
  RELAY_SERVER: "${{ secrets.RELAY_SERVER }}"
  API_SERVER: "${{ secrets.API_SERVER }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: Build Windows x64 Flutter & Portable
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # 🌟 核心：注入自定义服务器、Key、应用名、配置文件夹以及便携版解压运行目录
      - name: Inject Custom Server, Key, App Name and Config Directory
        shell: bash
        run: |
          python3 - << 'EOF'
          import os, glob, re

          server = os.environ.get("RENDEZVOUS_SERVER", "").strip()
          key = os.environ.get("RS_PUB_KEY", "").strip()
          relay = os.environ.get("RELAY_SERVER", "").strip()
          api = os.environ.get("API_SERVER", "").strip()
          custom_app = os.environ.get("CUSTOM_APP_NAME", "").strip()
          custom_folder = os.environ.get("CUSTOM_CONFIG_DIR", "").strip() or custom_app

          print(f"[CI-CONFIG] Injected Settings ->")
          print(f"  Server: {server or '(default)'}")
          print(f"  Key: {bool(key)}")
          print(f"  Relay: {relay or '(default)'}")
          print(f"  Api: {api or '(default)'}")
          print(f"  Custom App Name: {custom_app or '(default)'}")
          print(f"  Custom Config Folder: {custom_folder or '(default)'}")

          all_rs = glob.glob("**/*.rs", recursive=True)

          for path in all_rs:
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
              except Exception:
                  continue

              orig = content

              # 1. 替换默认服务器
              if server:
                  content = re.sub(r'(pub\s+const\s+DEFAULT_RENDEZVOUS_SERVER\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + server + '";', content)
                  content = re.sub(r'(pub\s+const\s+RENDEZVOUS_SERVERS\s*:\s*&\[&str\]\s*=\s*&\[)[^\]]*(\];)', r'\g<1>"' + server + r'"\g<2>', content)
              # 2. 替换公钥
              if key:
                  content = re.sub(r'(pub\s+const\s+DEFAULT_RS_PUB_KEY\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + key + '";', content)
                  content = re.sub(r'(pub\s+const\s+RS_PUB_KEY\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + key + '";', content)
              # 3. 替换中继
              if relay:
                  content = re.sub(r'(pub\s+const\s+DEFAULT_RELAY_SERVER\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + relay + '";', content)
              # 4. 替换 API Server
              if api:
                  content = re.sub(r'(pub\s+const\s+DEFAULT_API_SERVER\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + api + '";', content)
                  content = re.sub(r'(pub\s+const\s+API_SERVER\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + api + '";', content)

              # 5. 替换 APP_NAME (全局应用标识及 IPC 管道)
              if custom_app:
                  content = re.sub(r'(pub\s+const\s+APP_NAME\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + custom_app + '";', content)
                  content = re.sub(r'(const\s+APP_NAME\s*:\s*&str\s*=\s*)[^;]+;', r'\g<1>"' + custom_app + '";', content)

              # 6. 强制替换配置存储路径 (决定 AppData/Roaming 目录)
              if custom_folder:
                  content = re.sub(r'ProjectDirs::from\(([^,]+),\s*([^,]+),\s*APP_NAME\)', r'ProjectDirs::from(\g<1>, \g<2>, "' + custom_folder + '")', content)
                  content = re.sub(r'ProjectDirs::from\(([^,]+),\s*([^,]+),\s*"RustDesk"\)', r'ProjectDirs::from(\g<1>, \g<2>, "' + custom_folder + '")', content)

              if content != orig:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"[CI-CONFIG] Patched: {path}")

          # 7. 替换便携版打包程序中的解压目录与运行时工作路径
          if custom_folder or custom_app:
              target_name = custom_folder or custom_app
              for p in glob.glob("libs/portable/**/*.rs", recursive=True) + glob.glob("libs/portable/**/*.py", recursive=True):
                  try:
                      with open(p, "r", encoding="utf-8", errors="ignore") as f: c = f.read()
                      c2 = c.replace('"RustDesk"', f'"{target_name}"').replace('"rustdesk"', f'"{target_name.lower()}"')
                      if c2 != c:
                          with open(p, "w", encoding="utf-8") as f: f.write(c2)
                          print(f"[CI-CONFIG] Patched Portable Packer: {p}")
                  except Exception: pass

          # 8. 替换 Windows Runner 原生窗口标题与资源描述
          if custom_app:
              for p in glob.glob("flutter/windows/runner/*.cpp") + glob.glob("flutter/windows/runner/*.rc"):
                  try:
                      with open(p, "r", encoding="utf-8", errors="ignore") as f: c = f.read()
                      c2 = c.replace('L"RustDesk"', f'L"{custom_app}"').replace('"RustDesk"', f'"{custom_app}"')
                      if c2 != c:
                          with open(p, "w", encoding="utf-8") as f: f.write(c2)
                          print(f"[CI-CONFIG] Patched Windows runner: {p}")
                  except Exception: pass
          EOF

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
              Write-Host "Ignore printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable (Portable)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi installer
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi
          sha256sum ../../SignOutput/rustdesk-*.msi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-windows-x64
          path: ./SignOutput/

      - name: Publish Release (Optional)
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: env.UPLOAD_ARTIFACT == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/rustdesk-*.msi
            ./SignOutput/rustdesk-*.exe
